type: custom:bubble-card
card_type: pop-up
hash: '#homepod_gost'
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
show_header: false
close_by_clicking_outside: true
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
      
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: >-
          Homepod Mini {% if is_state('binary_sensor.multirum_homepod','on')
          %}{% else %}(Гостиная){% endif %}
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: phu:homepod-mini
      - type: spacer
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.multirum_homepod
            state: 'on'
        chip:
          type: template
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:home-sound-in
          icon_color: 120,120,120,0.5
          picture: /local/png_icons/homepod_stereo.png
          tap_action:
            action: navigate
            navigation_path: '#homepod_multiroom'
          card_mod:
            style:
              .: |
                {% set hover = 'true' %}
                {% set stating = 'false' %}
                {% include 'chip_settings_style.jinja' %}
      - type: template
        entity: sensor.homepod_gostinaia_trek
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:clock-outline
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: template
        entity: media_player.homepod_mini_gost
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:information
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mini-media-player
    entity: media_player.homepod_mini_gost
    background: /local/cards_img/homepod_gost.png
    artwork: full-cover
    hide:
      name: true
      info: true
      controls: true
      source: true
      power: true
      volume: true
      progress: true
      icon: true
    toggle_power: false
    tap_action:
      action: none
    card_mod:
      style: |
        ha-card {
          aspect-ratio: 1 / 1;
          {% if is_state(config.entity, 'playing') %}
          {% else %}
          opacity: 0.4;
          {% endif %}
        }
  - type: custom:mushroom-template-card
    features_position: bottom
    entity: media_player.homepod_mini_gost
    grid_options:
      columns: 12
      rows: auto
    tap_action:
      action: none
    icon_tap_action:
      action: none
    primary: >
      {% if state_attr(config.entity,'media_title') is none or 
      state_attr(config.entity,'media_title') == ''%}  Homepod Mini (Гостиная)

      {% elif state_attr(config.entity,'media_title') == 'Streaming with pyatv'
      %} Стриминг из локальной сети

      {% else%} {{state_attr(config.entity, 'media_title')}}

      {% endif %}
    secondary: >-
      {{ state_attr(config.entity, 'media_artist') | default('Неизвестно',
      true)}}
    card_mod:
      style: |
        ha-card {
          zoom: 1.5;
          background: none !important;
        }
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity: media_player.homepod_mini_gost
            state: playing
          - condition: state
            entity: media_player.homepod_mini_gost
            state: paused
    card:
      entity: media_player.homepod_mini_gost
      tap_action: none
      hide:
        icon: true
        name: true
        runtime: true
        source: true
        power: true
        state_label: true
        volume: true
        info: true
        progress: false
        controls: true
      more_info: false
      type: custom:mini-media-player
      toggle_power: false
      group: true
      volume_stateless: false
      card_mod:
        style:
          .: |
            ha-card {
              height: var(--mmp-progress-height);
              --mmp-accent-color: rgba(var(--rgb-primary-text-color),1);;
              --ha-card-border-width: 0;
              margin: 0px 30px; 
            }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.homepod_mini_gost
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-previous
        tap_action:
          action: perform-action
          perform_action: media_player.media_previous_track
          target:
            entity_id: media_player.homepod_mini_gost
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.homepod_mini_gost
        grid_options:
          columns: 12
          rows: auto
        tap_action:
          action: perform-action
          perform_action: media_player.media_play_pause
          target:
            entity_id:
              - media_player.homepod_mini_gost
        vertical: true
        icon: |
          {% if is_state(entity, 'playing')%} fas:pause
          {% elif is_state(entity, 'paused')%} fas:play
          {% else %}fas:lock{% endif%}
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.homepod_mini_gost
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-next
        tap_action:
          action: perform-action
          perform_action: media_player.media_next_track
          target:
            entity_id: media_player.homepod_mini_gost
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
  - type: custom:mushroom-media-player-card
    entity: media_player.homepod_mini_gost
    volume_controls:
      - volume_set
    layout: horizontal
    primary_info: none
    secondary_info: none
    icon_type: none
    card_mod:
      style:
        mushroom-media-player-volume-control$: |
          mushroom-slider {
            --main-color: #505050 !important;
            --bg-color: #50505055 !important;
            --control-height: 25px !important;
          }
        .: |
          ha-card {
            background: transparent !important;
            opacity: 100%;
            margin: 0px 20px !important;
            border-width: 0px;
            margin: 0px 0px 0px;
          }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: conditional
        conditions:
          - condition: user
            users:
              - 1a1897c1b5d24702ae00645a47e23e99
              - c95afac8be3b49daa933c3401afa2ad8
              - 1a1897c1b5d24702ae00645a47e23e99
              - 1a1897c1b5d24702ae00645a47e23e99
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: input_boolean.homepod_play_stanislav
          grid_options:
            columns: 12
            rows: auto
          icon: mdi:face-man-shimmer
          tap_action:
            action: toggle
          vertical: true
          icon_tap_action:
            action: none
          color: white
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none !important;
              }
      - type: conditional
        conditions:
          - condition: user
            users:
              - 74b41be9c40e417888b511bff15eebe4
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: input_boolean.homepod_play_melkaia
          grid_options:
            columns: 12
            rows: auto
          icon: mdi:face-woman-shimmer
          tap_action:
            action: toggle
          vertical: true
          icon_tap_action:
            action: none
          color: white
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none !important;
              }
      - type: conditional
        conditions:
          - condition: user
            users:
              - 1a1897c1b5d24702ae00645a47e23e99
              - c95afac8be3b49daa933c3401afa2ad8
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: input_boolean.novaia_muzyka_homepod_gostinaia
          grid_options:
            columns: 12
            rows: auto
          icon: mdi:star-circle
          tap_action:
            action: toggle
          vertical: true
          icon_tap_action:
            action: none
          color: white
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none !important;
              }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: input_boolean.homepod_gostinaia_les
        grid_options:
          columns: 12
          rows: auto
        icon: ph:tree-fill
        tap_action:
          action: toggle
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
popup_mode: fit-content
card_layout: large
slide_to_close_distance: '500'
